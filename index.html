<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勤務表メーカー</title>
<style>
/* 配色：ブランドはティール。パターンの色分けは、色覚の多様性に配慮して検証済みの順序の配色（--c1〜--c8）を使う */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--good:#0ca30c;--crit:#d03b3b;--warnc:#fab219;--side1:#0f6b63;--side2:#0a4a45;--shadow:0 1px 2px rgba(16,40,38,.05),0 6px 18px rgba(16,60,56,.07);--bg:#f3f6f6;--card:#fff;--ink:#1f2a30;--sub:#5b6b73;--line:#d6dee2;--pri:#0f766e;--pri2:#e3f3f1;--sat:#2563eb;--sun:#dc2626;--work:#0f766e;--workbg:#d9f2ee;--off:#c2410c;--offbg:#fde6d8;--warn:#fff6e0;--warnline:#f0c36d;--err:#fdeaea;--errline:#e8a0a0;--ok:#e7f6ea;--okline:#8fd19e}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);font-size:15px;line-height:1.55}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:16px 0 6px;color:var(--pri)}
.hint{color:var(--sub);font-size:13px;margin:4px 0 10px}
.lead{background:var(--pri2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
input,select,button{font-family:inherit;font-size:14px}
input[type=text],input[type=time],input[type=number],input[type=date],input[type=month],select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink)}
input[type=number]{width:64px}
input.title{font-size:16px;font-weight:700;width:min(420px,100%)}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--pri)}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.big{font-size:16px;padding:10px 22px}
button.danger{color:var(--sun)}
button.small{padding:3px 8px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cardhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse}
table.edit th,table.edit td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
table.edit th{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
.wds{display:flex;gap:2px}
.wds label{display:flex;flex-direction:column;align-items:center;font-size:12px;cursor:pointer;min-width:22px}
.c0{color:var(--sun)}.c6{color:var(--sat)}.ch{color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 18px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.grid>label{min-width:0}
select{max-width:100%;text-overflow:ellipsis}
.grid label>span{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pri2);border-radius:999px;padding:2px 4px 2px 10px;margin:0 6px 6px 0;font-size:13px}
.chip button{border:0;background:none;padding:0 6px;color:var(--sub)}
.pats{display:flex;gap:6px;flex-wrap:wrap}
.pats label{border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:5px}
.pats label.on{background:var(--pri2);border-color:var(--pri)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:14px}
details.csvbox{margin-top:0;border-top:1px solid var(--line);padding-top:12px}
.csvsum{font-size:15px;padding:2px 0}
.steps{padding-left:20px;font-size:14px}.steps li{margin-bottom:8px}
.gfinfo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafcfc}
.btnlink{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;color:var(--ink);text-decoration:none;background:#fff}
textarea{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
details.csvbox[open] .csvsum{margin-bottom:8px}
.eff{font-size:13px;color:var(--sub);margin-top:8px}
.ublist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ublist button{display:flex;flex-direction:column;align-items:flex-start;min-width:96px;padding:6px 10px}
.ublist button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ublist small{font-size:11px;opacity:.85}
.modes{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.modes button.on.mW{background:var(--work);color:#fff;border-color:var(--work)}
.modes button.on.mO{background:var(--off);color:#fff;border-color:var(--off)}
.modes button.on.mX{background:#555;color:#fff;border-color:#555}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:640px}
.cal .hd{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cal .cell{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:12px}
.cal .cell .n{font-size:15px;font-weight:700;white-space:nowrap}
.cal .cell .hn{font-size:10px;color:var(--sun);line-height:1.2}
.cal .cell.empty{border:0;background:none;cursor:default}
.cal .cell.na{background:#eef1f2;color:#9aa6ac}
.cal .cell.w{background:var(--workbg);border-color:var(--work)}
.cal .cell.o{background:var(--offbg);border-color:var(--off)}
.badge{display:inline-block;border-radius:4px;padding:0 5px;font-size:11px;font-weight:700;color:#fff}
.badge.w{background:var(--work)}.badge.o{background:var(--off)}
.counter{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.counter b.over{color:var(--sun)}
.box{border-radius:8px;padding:12px 16px;margin-bottom:14px;border:1px solid}
.box h3{margin:0 0 6px;font-size:15px;color:inherit}
.box ul{margin:6px 0 0;padding-left:20px}
.box li{margin-bottom:4px}
.box.err{background:var(--err);border-color:var(--errline)}
.box.warn{background:var(--warn);border-color:var(--warnline)}
.box.ok{background:var(--ok);border-color:var(--okline)}
table.sheet{font-size:13px;background:#fff}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:3px 5px;text-align:center;white-space:nowrap}
table.sheet th{background:#f0f4f5;font-weight:600}
table.sheet td.nm,table.sheet th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
table.sheet th.nm{background:#f0f4f5}
table.sheet tr.wk td{background:#fbf3f3}
table.sheet tr.sat td{background:#f1f5fd}
table.sheet td.lack{background:var(--err);color:var(--sun);font-weight:700}
table.sheet td.cw{box-shadow:inset 0 0 0 2px var(--work)}
table.sheet td.cwx{background:var(--warn);box-shadow:inset 0 0 0 2px var(--warnline)}
table.sheet td.co{background:var(--offbg);color:var(--off)}
table.sheet td.cox{background:var(--err);color:var(--sun);font-weight:700}
.legend{font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:50;font-size:18px;font-weight:700;color:var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a30;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
.stat td{padding:4px 10px;border-bottom:1px solid var(--line);font-size:14px}
/* 区切りボタン（セグメント） */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;padding:8px 16px;font-weight:600;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pri);color:#fff}
.seg.modes{display:flex;margin:8px 0 12px}
.seg.modes button{flex:1}
.seg.modes button.on.mW{background:var(--work)}.seg.modes button.on.mO{background:var(--off)}.seg.modes button.on.mX{background:#555}
.tools{margin-bottom:12px}
.wide{width:100%;max-width:520px}
.nextnav{display:flex;justify-content:flex-end;margin:8px 0 24px}
.nextnav button{padding:10px 20px;font-size:15px}
.nawork{font-size:10px}
.views[data-view=day] .v-person,.views[data-view=day] .v-sum,.views[data-view=person] .v-day,.views[data-view=person] .v-sum,.views[data-view=sum] .v-day,.views[data-view=sum] .v-person{display:none}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.pitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip2{font-size:12px;background:#f0f4f5;border-radius:6px;padding:2px 6px}
.chip2.ch{color:var(--sun)}.chip2.c6{color:var(--sat)}

/* ===== レイアウト：左のメニュー＋上のバー（スマホは下のタブ） ===== */
#shell{display:flex;min-height:100vh}
#side{width:232px;flex:0 0 232px;background:linear-gradient(180deg,var(--side1),var(--side2));color:#e6f3f1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
#side .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#fff;padding:4px 8px 20px;letter-spacing:.02em}
#side .brand svg{width:28px;height:28px}
#side .menu{display:flex;flex-direction:column;gap:4px}
#side .menu button{display:flex;align-items:center;gap:12px;border:0;background:none;color:#d7ece9;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left;font-weight:600}
#side .menu button:hover{background:rgba(255,255,255,.08)}
#side .menu button.on{background:rgba(255,255,255,.16);color:#fff}
#side .menu svg{width:21px;height:21px;flex:0 0 21px}
#side .foot{margin-top:auto;font-size:11px;color:#a9d3cd;padding:12px 8px 0;line-height:1.6}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px;flex-wrap:wrap}
#topbar h1{font-size:20px;margin:0;font-weight:800;color:var(--ink)}
#topbar .brand-m{display:none}
.period{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;margin-left:auto}
.period svg{width:18px;height:18px;color:var(--pri)}
.period .pl{font-size:12px;color:var(--sub)}
.period input[type=month]{border:0;padding:4px;font-weight:700;width:150px;background:transparent}
.period button{border:0;background:#f0f4f4;border-radius:8px;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
.period button svg{width:16px;height:16px;color:var(--ink)}
#plabel{font-size:13px;color:var(--pri);white-space:nowrap}
.newbtn{display:flex;align-items:center;gap:6px;border-radius:12px!important;padding:9px 16px!important}
.newbtn svg{width:18px;height:18px}
main{max-width:1240px;width:100%;margin:0 auto;padding:20px 24px;box-sizing:border-box}
.card{border-radius:14px;box-shadow:var(--shadow);border-color:#e3ebea}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 svg{width:20px;height:20px;color:var(--pri)}
.lead{border-radius:12px}
#bnav{display:none}
.ico{width:20px;height:20px;flex:0 0 auto}
/* 統計カード */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid #e3ebea;padding:14px 16px;display:flex;align-items:center;gap:12px;min-width:0}
.stat .si{width:42px;height:42px;border-radius:12px;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.stat .si svg{width:24px;height:24px}
.stat .sl{font-size:12px;color:var(--sub)}
.stat .sv{font-size:24px;font-weight:800;line-height:1.15;color:var(--ink)}
.stat .sv small{font-size:13px;font-weight:600;margin-left:2px}
.stat.alert{background:#fff5f5;border-color:#f3cccc}.stat.alert .si{background:#fde3e3;color:var(--crit)}.stat.alert .sl{color:var(--crit);font-weight:700}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.dash .card{margin:0}
.dash .col{display:flex;flex-direction:column;gap:16px;min-width:0}
/* ダッシュボードのカレンダー */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mcal .h{background:#f0f4f4;text-align:center;font-size:12px;padding:4px 0;color:var(--sub);font-weight:700}
.mcal .d{min-height:62px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.mcal .d:nth-child(7n+1){border-left:0}
.mcal .d.hol,.mcal .d.sun{background:#fdf3f3}.mcal .d.sat{background:#f2f6fd}.mcal .d.out{background:#fafbfb}
.mcal .d .hn{font-size:9px;color:var(--sun);font-weight:600;line-height:1.1}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.lack{background:#fff!important;box-shadow:inset 0 0 0 2px var(--crit)}
.mcal .wn{font-size:10px;color:var(--off);font-weight:600;margin-top:auto}
.plegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.plegend span{display:inline-flex;align-items:center;gap:5px}
/* パターンの色バッジ（文字は本文の色、色は左の印と縁で示す） */
.pbadge{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:1px 8px 1px 6px;font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--pc) 14%,#fff);border:1px solid color-mix(in srgb,var(--pc) 55%,#fff);white-space:nowrap}
.pbadge::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc)}
/* 充足状況 */
.fill{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:8px 12px;align-items:center;font-size:14px}
.bar{height:10px;border-radius:5px;background:#e8eeee;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.fill .pct{font-weight:800;text-align:right;white-space:nowrap}
.fill .pct small{font-weight:500;color:var(--sub);margin-left:4px}
.lackn{display:inline-flex;align-items:center;gap:3px;color:var(--crit);font-size:12px;font-weight:700}
.lackn svg{width:14px;height:14px}
/* 次のアクション */
.acts{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.acts ul{list-style:none;margin:0;padding:0;flex:1;min-width:220px}
.acts li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.acts li svg{width:20px;height:20px;color:#b8c4c6}
.acts li.done svg{color:var(--good)}
.acts .btns{display:flex;flex-direction:column;gap:8px;min-width:190px}
.acts .btns button{display:flex;align-items:center;justify-content:center;gap:6px}
.acts .btns svg{width:18px;height:18px}
.notice{list-style:none;margin:0;padding:0;font-size:13px}
.notice li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.notice li:last-child{border-bottom:0}
.notice li::before{content:"•";color:var(--pri)}
/* スマホのホーム：タイル */
.tiles{display:none}
.tile{background:#fff;border:1px solid #e3ebea;border-radius:14px;box-shadow:var(--shadow);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tile svg{width:30px;height:30px;color:var(--pri)}
.tile b{font-size:14px}.tile small{font-size:11px;color:var(--sub)}
/* パターン一覧（概要） */
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.slotcard{border:1px solid #e3ebea;border-radius:12px;padding:10px 12px;background:#fff;border-top:4px solid var(--pc)}
.slotcard .sc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slotcard .sc-t{font-size:17px;font-weight:800;margin:6px 0 2px}
.slotcard .sc-n{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
.slotcard .sc-n svg{width:14px;height:14px}
.pcard{border-top:4px solid var(--pc)}
/* メンバー一覧 */
table.mlist{width:100%;border-collapse:collapse}
table.mlist th{font-size:12px;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);background:#f7faf9}
table.mlist td{padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
table.mlist tr.mrow{cursor:pointer}table.mlist tr.mrow:hover td{background:#f5faf9}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pri2);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-right:8px;flex:0 0 30px}
.who{display:flex;align-items:center;font-weight:700}
.chipsP{display:flex;flex-wrap:wrap;gap:4px}
.cond{font-size:12px;color:var(--sub)}
details.ucard{padding:0}
details.ucard>summary.usum{list-style:none;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--ink)}
details.ucard>summary.usum::-webkit-details-marker{display:none}
details.ucard>summary.usum .tog{margin-left:auto;font-size:12px;color:var(--pri)}
details.ucard[open]>summary.usum{border-bottom:1px solid var(--line)}
details.ucard .ubody{padding:12px 16px 16px}
/* 個人別カレンダー */
.pstats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{border-radius:999px;padding:3px 12px;font-size:13px;background:#f0f4f4}
.pill b{font-size:15px;margin-left:4px}
.pill.w{background:var(--pri2)}.pill.o{background:var(--offbg)}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:640px}
.pcal .h{text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.pcal .d{border:1px solid var(--line);border-radius:8px;min-height:54px;padding:3px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;background:#fff}
.pcal .d.e{border:0;background:none}
.pcal .d .n{font-weight:700}
.pcal .d.hol .n,.pcal .d.sun .n{color:var(--sun)}.pcal .d.sat .n{color:var(--sat)}
.pcal .off{background:var(--offbg);color:var(--off);border-radius:6px;padding:0 6px;font-weight:700}
.pcal .none{color:#b8c4c6}
/* 充足率のドーナツ */
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut text{font-family:inherit}
.dleg{font-size:13px;display:flex;flex-direction:column;gap:6px}
.dleg span{display:inline-flex;align-items:center;gap:6px}
.dleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dleg svg{width:14px;height:14px;color:var(--crit)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.dash{grid-template-columns:1fr}}
@media (max-width:900px){
  #side{display:none}
  #topbar{padding:8px 12px;gap:8px}
  #topbar h1{display:none}

<input type="file" id="pcsvIn" accept=".csv,.txt,text/csv" hidden>
<input type="file" id="gcsvIn" accept=".csv,.tsv,.txt,text/csv" hidden>
<script>
'use strict';
/* =========================================================
   勤務表メーカー（試作版）
   - すべての処理はこの端末のブラウザの中で行います（通信しません）
   - データはブラウザ内（localStorage）に保存。バックアップは「保存・読込」から
   ========================================================= */
const KEY='kinmuhyo-app-v1';
const WD='日月火水木金土';
const HOLOPT={normal:'曜日どおり（祝日も勤務）',exclude:'祝日は勤務なし',add:'選んだ曜日＋祝日',only:'祝日だけ勤務'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):0};
const isNum=v=>typeof v==='number'&&isFinite(v);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function nextMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function blankSp(){return{ng:[],intD:null,intH:null,max:null,maxW:null,maxO:null,offPrev:null,slotMax:{},wkMin:null,wkMax:null,patShare:{},prefDays:allDays(false),prefShare:null,consecMax:null}}
function defSettings(){return{offPrev:false,intMode:'common',keep:null,consec:null,startDay:1,gas:{url:'',key:''}}}
function addMonth(m,k){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function thisMonth(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const ymLabel=m=>{const [y,mm]=m.split('-').map(Number);return `${y}年${mm}月`};
function allDays(v){return [v,v,v,v,v,v,v]}

/* ---------- 保存 ---------- */
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('この端末に保存できませんでした。「保存・読込」からファイルに書き出してください')}}

function sampleState(){
  const p1={id:'p_'+uid(),name:'医師 当直・日直',slots:[
    {id:uid(),name:'日直',abbr:'日',start:'08:30',end:'17:00',need:1,days:[true,false,false,false,false,false,true],hol:'add'},
    {id:uid(),name:'当直',abbr:'当',start:'17:00',end:'08:30',need:1,days:allDays(true),hol:'normal'}],
    intD:0,intH:12,maxM:8,maxW:3,maxO:5,hardW:false,hardO:true};
  const p2={id:'p_'+uid(),name:'外来（午前）',slots:[
    {id:uid(),name:'午前外来',abbr:'外',start:'09:00',end:'12:30',need:2,days:[false,true,true,true,true,true,false],hol:'exclude'}],
    intD:0,intH:0,maxM:14,maxW:3,maxO:5,hardW:false,hardO:true};
  const mk=(n,pats)=>({id:'u_'+uid(),name:n,pats,sp:blankSp()});
  const users=[mk('田中',[p1.id,p2.id]),mk('佐藤',[p1.id,p2.id]),mk('鈴木',[p1.id]),mk('高橋',[p1.id]),mk('伊藤',[p1.id]),mk('渡辺',[p1.id]),mk('山本',[p2.id]),mk('中村',[p2.id])];
  users[1].sp.ng.push({allDay:true,start:'00:00',end:'00:00',days:[false,false,false,true,false,false,false],hol:false});
  users[2].sp.max=4;
  return{v:1,month:nextMonth(),settings:defSettings(),patterns:[p1,p2],users,wishes:{},extraHol:[],results:{}};
}
function migrate(s){
  s.patterns=s.patterns||[];s.users=s.users||[];s.extraHol=s.extraHol||[];s.results=s.results||{};
  // 希望は実際の日付（YYYY-MM-DD）で保存する。旧形式（月ごと・日の番号）から移し替え
  if(!s.wishD||typeof s.wishD!=='object')s.wishD={};
  if(s.wishes&&typeof s.wishes==='object'){Object.entries(s.wishes).forEach(([m,byU])=>Object.entries(byU||{}).forEach(([u,w])=>Object.entries(w||{}).forEach(([d,v])=>{
    if(!/^\d{4}-\d{2}$/.test(m)||!(+d>=1&&+d<=31))return;(s.wishD[u]=s.wishD[u]||{})[m+'-'+pad(+d)]=v})))}
  delete s.wishes;
  if(!s.month)s.month=nextMonth();
  s.settings=Object.assign(defSettings(),s.settings||{});
  if(!s.settings.gas||typeof s.settings.gas!=='object')s.settings.gas={url:'',key:''};
  if(!s.gforms||typeof s.gforms!=='object')s.gforms={};
  if(!Array.isArray(s.balance))s.balance=[];
  s.patterns.forEach(p=>{p.slots=p.slots||[];if(!p.mode)p.mode='fixed';p.combos=p.combos||[];if(p.fair===undefined)p.fair=true;p.slots.forEach(x=>{if(!x.days)x.days=allDays(true);if(!x.hol)x.hol='normal'})});
  s.users.forEach(u=>{u.pats=u.pats||[];u.sp=Object.assign(blankSp(),u.sp||{});['slotMax','patShare'].forEach(k=>{if(!u.sp[k]||typeof u.sp[k]!=='object')u.sp[k]={}});if(!Array.isArray(u.sp.prefDays))u.sp.prefDays=allDays(false)});
  return s;
}
let S=migrate(load()||sampleState());
const UI={tab:'home',wu:null,mode:'W',budget:3000,busy:false,hist:null,view:'day',pv:null,openU:new Set()};
/* 保存期間を過ぎた月の勤務表・希望を消す（monthsToPurge で対象を確認） */
function monthsToPurge(keep){
  if(keep==null)return[];const cut=addMonth(thisMonth(),-keep);
  const all=new Set(Object.keys(S.results||{}));Object.values(S.wishD||{}).forEach(w=>Object.keys(w).forEach(iso=>all.add(iso.slice(0,7))));
  return [...all].filter(m=>m<cut).sort();
}
function purgeOld(){const keep=S.settings.keep;if(keep==null)return;const cut=addMonth(thisMonth(),-keep);
  Object.keys(S.results).forEach(m=>{if(m<cut)delete S.results[m]});
  Object.values(S.wishD).forEach(w=>Object.keys(w).forEach(iso=>{if(iso.slice(0,7)<cut)delete w[iso]}))}
purgeOld();

/* ---------- 祝日（日本） ---------- */
const holCache={};
function jpHol(y){
  if(holCache[y])return holCache[y];
  const h={},k=(m,d)=>m*100+d,set=(m,d,n)=>{h[k(m,d)]=n};
  const nth=(m,n)=>{const w=new Date(y,m-1,1).getDay();return 1+((8-w)%7)+7*(n-1)};
  const eq=(a,b)=>Math.floor(a+0.242194*(y-1980)-Math.floor((y-1980)/4));
  set(1,1,'元日');set(1,nth(1,2),'成人の日');set(2,11,'建国記念の日');if(y>=2020)set(2,23,'天皇誕生日');
  set(3,eq(20.8431),'春分の日');set(4,29,'昭和の日');set(5,3,'憲法記念日');set(5,4,'みどりの日');set(5,5,'こどもの日');
  set(7,nth(7,3),'海の日');set(8,11,'山の日');set(9,nth(9,3),'敬老の日');set(9,eq(23.2488),'秋分の日');
  set(10,nth(10,2),'スポーツの日');set(11,3,'文化の日');set(11,23,'勤労感謝の日');
  const base=Object.keys(h).map(Number);
  const has=dt=>dt.getFullYear()===y&&!!h[k(dt.getMonth()+1,dt.getDate())];
  for(let dt=new Date(y,0,2);dt.getFullYear()===y;dt.setDate(dt.getDate()+1)){
    if(has(dt)||dt.getDay()===0)continue;
    const p=new Date(dt),n=new Date(dt);p.setDate(p.getDate()-1);n.setDate(n.getDate()+1);
    if(has(p)&&has(n))h[k(dt.getMonth()+1,dt.getDate())]='国民の休日';
  }
  base.forEach(key=>{const dt=new Date(y,Math.floor(key/100)-1,key%100);if(dt.getDay()!==0)return;
    do{dt.setDate(dt.getDate()+1)}while(has(dt));if(dt.getFullYear()===y)h[k(dt.getMonth()+1,dt.getDate())]='振替休日'});
  return holCache[y]=h;
}
function holName(Y,M,d){
  const dt=new Date(Y,M-1,d),y=dt.getFullYear(),m=dt.getMonth()+1,dd=dt.getDate();
  const iso=y+'-'+pad(m)+'-'+pad(dd);
  const ex=S.extraHol.find(x=>x.date===iso);
  if(ex)return ex.name||'休日';
  return jpHol(y)[m*100+dd]||'';
}
/* 勤務表の期間：S.month（開始する月）の「作成開始日」から、翌月の作成開始日の前日まで。
   d は期間の何日目か（1〜nd） */
function startDayOf(){const v=+S.settings.startDay;return v>=1&&v<=28?Math.floor(v):1}
function periodLabel(key,s0){const [Y,M]=key.split('-').map(Number);s0=s0||1;if(s0===1)return `${Y}年${M}月`;
  const e=new Date(Y,M,s0-1);return `${Y}年${M}月${s0}日〜${e.getFullYear()!==Y?e.getFullYear()+'年':''}${e.getMonth()+1}月${e.getDate()}日`}
function monthInfo(key,s0){
  key=key||S.month;s0=s0||startDayOf();
  const [Y,M]=key.split('-').map(Number);const nd=Math.round((new Date(Y,M,s0)-new Date(Y,M-1,s0))/864e5);
  const hol={},wd={},md={},iso={},dn={};
  for(let d=1;d<=nd;d++){const dt=new Date(Y,M-1,s0+d-1);hol[d]=holName(Y,M,s0+d-1);wd[d]=dt.getDay();dn[d]=dt.getDate();
    md[d]=`${dt.getMonth()+1}/${dt.getDate()}`;iso[d]=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
  return{Y,M,s0,nd,hol,wd,md,iso,dn,label:periodLabel(key,s0)};
}
const lab=(mi,d)=>mi.md?mi.md[d]:`${mi.M}/${d}`;
const dnum=(mi,d)=>mi.dn?mi.dn[d]:d;
const fd=(mi,d)=>`${lab(mi,d)}(${WD[mi.wd[d]]})`;
const resLabel=r=>(r.mi&&r.mi.label)||ymLabel(r.month);
function fmtGap(min){if(min<0)return '重なっている';const d=Math.floor(min/1440),h=Math.round(min%1440/60*10)/10;return (d?d+'日':'')+h+'時間'}
function periodWishes(uidv,mi){mi=mi||monthInfo();const w=S.wishD[uidv]||{},o={};for(let d=1;d<=mi.nd;d++){const v=w[mi.iso[d]];if(v)o[d]=v}return o}
function setWish(uidv,d,v){const mi=monthInfo();const w=S.wishD[uidv]||(S.wishD[uidv]={});if(v)w[mi.iso[d]]=v;else delete w[mi.iso[d]]}

/* ---------- 実際に使う条件（パターン＋本人の特別条件） ---------- */
function eff(u){
  const pats=S.patterns.filter(p=>u.pats.includes(p.id));const sp=u.sp;
  const lim=(own,key)=>{if(isNum(own))return own;if(!pats.length)return 0;if(pats.some(p=>!isNum(p[key])))return null;return Math.max(...pats.map(p=>p[key]))};
  let interval;
  if(isNum(sp.intD)||isNum(sp.intH))interval=(sp.intD||0)*1440+(sp.intH||0)*60;
  else interval=Math.max(0,...pats.map(p=>(p.intD||0)*1440+(p.intH||0)*60));
  const own=isNum(sp.intD)||isNum(sp.intH);
  const offPrev=typeof sp.offPrev==='boolean'?sp.offPrev:!!S.settings.offPrev;
  const gC=isNum(S.settings.consec)?S.settings.consec:null,uC=isNum(sp.consecMax)?sp.consecMax:null;
  const consecHard=uC??gC,consecSoft=uC!=null&&gC!=null&&uC>gC?gC:null;
  return{pats,interval,own,offPrev,consecHard,consecSoft,max:isNum(sp.max)?sp.max:null,maxW:lim(sp.maxW,'maxW'),maxO:lim(sp.maxO,'maxO'),
    hardW:pats.some(p=>p.hardW),hardO:pats.some(p=>p.hardO)};
}
function runsOn(s,wd,isH){
  switch(s.hol){case 'exclude':return s.days[wd]&&!isH;case 'add':return s.days[wd]||isH;case 'only':return isH;default:return !!s.days[wd]}
}
/* 本人の「勤務できない時間」に当たるか */
/* 戻り値：'hard'（不可）／'soft'（できれば避ける）／''（当たらない） */
function ngHit(u,x,mi){let soft='';
  for(const r of u.sp.ng){
    const rs=r.allDay?0:toMin(r.start);let re=r.allDay?1440:toMin(r.end);if(re<=rs)re+=1440;
    for(let dd=x.d-1;dd<=x.d+1;dd++){
      const s0=mi.s0||1,dt=new Date(mi.Y,mi.M-1,s0+dd-1),w=dt.getDay(),isH=!!holName(mi.Y,mi.M,s0+dd-1);
      const afterH=r.afterHol&&!!holName(mi.Y,mi.M,s0+dd-2);
      if(!(r.days[w]||(r.hol&&isH)||afterH))continue;
      const base=(dd-1)*1440;
      if(x.s<base+re&&base+rs<x.e){if(r.soft)soft='soft';else return 'hard'}
    }
  }
  return soft;
}

/* ---------- 問題の組み立て ---------- */
function buildProblem(){
  const mi=monthInfo();const errors=[];
  const pIndex={};S.patterns.forEach((p,i)=>pIndex[p.id]=i);
  const slots=[];S.patterns.forEach((p,pi)=>p.slots.forEach(s=>slots.push({pi,s,p})));
  const inst=[],groups=[];
  const mkInst=(d,wd,isH,o,si,need,g)=>{const s=o.s;const st=toMin(s.start),e0=toMin(s.end),en=e0<=st?e0+1440:e0;
    inst.push({d,wd,isH,wk:wd===0||wd===6||isH,pi:o.pi,si,pname:o.p.name||'(無名)',sname:s.name||'(無名)',abbr:s.abbr||(s.name||'?').slice(0,1),
      need,s:(d-1)*1440+st,e:(d-1)*1440+en,slotId:s.id,g});return inst.length-1};
  for(let d=1;d<=mi.nd;d++){
    const wd=mi.wd[d],isH=!!mi.hol[d];
    slots.forEach((o,si)=>{const s=o.s;if(o.p.mode==='combo'||!(s.need>0)||!runsOn(s,wd,isH))return;mkInst(d,wd,isH,o,si,Math.floor(s.need),-1)});
    // 組み合わせ：その日に使える組み合わせ（含まれる時間帯がすべてその日に動く）から1つを選ぶ
    S.patterns.forEach((p,pi)=>{if(p.mode!=='combo')return;
      const opts=p.combos.map(c=>p.slots.map(sl=>Math.max(0,Math.floor(c.counts&&c.counts[sl.id]||0)))).filter(cs=>cs.some(n=>n>0)&&cs.every((n,k)=>!n||runsOn(p.slots[k],wd,isH)));
      if(!opts.length)return;
      const g=groups.length,gi=[],go=[];
      p.slots.forEach((sl,k)=>{const mx=Math.max(...opts.map(cs=>cs[k]));if(!mx)return;const si=slots.findIndex(o=>o.s===sl);gi.push(mkInst(d,wd,isH,slots[si],si,mx,g));go.push(k)});
      groups.push({d,pi,inst:gi,opts:opts.map(cs=>go.map(k=>cs[k]))});
    });
  }
  const U=S.users.filter(u=>u.pats.some(id=>id in pIndex)).map(u=>{
    const E=eff(u),w=periodWishes(u.id,mi);
    const wW=[],wO=[];Object.keys(w).forEach(d=>{const n=+d;if(n<1||n>mi.nd)return;if(w[d]==='W')wW.push(n);else if(w[d]==='O')wO.push(n)});
    const capP=S.patterns.map(p=>u.pats.includes(p.id)&&isNum(p.maxM)?p.maxM:null);
    // 勤務のあとに最低あける時間（パターンごと／共通）
    const common=S.settings.intMode!=='perPattern'||E.own;
    const req=S.patterns.map(p=>common?E.interval:(p.intD||0)*1440+(p.intH||0)*60);
    const sp=u.sp,slotCap=slots.map(o=>isNum(sp.slotMax[o.s.id])?sp.slotMax[o.s.id]:null);
    const share=S.patterns.map(p=>u.pats.includes(p.id)&&isNum(sp.patShare[p.id])?sp.patShare[p.id]/100:null);
    const pref=sp.prefDays.some(Boolean)&&isNum(sp.prefShare)?{days:sp.prefDays,r:sp.prefShare/100}:null;

        const bad=[];for(let w=0;w<P.nW;w++){if(wc[w]<E.wkLo[w]||wc[w]>E.wkHi[w]){const ds=Object.keys(P.week).filter(d=>P.week[d]===w).map(Number);bad.push(`${lab(mi,ds[0])}〜${lab(mi,ds[ds.length-1])}の週は${wc[w]}回`)}}

function solveAll(budget){
  const P=buildProblem(),created=new Date().toLocaleString('ja-JP');
  if(P.errors.length)return{month:S.month,created,pre:true,ok:false,errors:P.errors};
  const R=3;let best=null;
  for(let r=0;r<R;r++){const so=makeSolver(P);so.greedy();so.anneal(budget/R);const b=so.best();if(b.asg&&(!best||b.cost<best.cost))best=b;if(best&&best.cost<1e-9)break}
  const fin=makeSolver(P);if(best)fin.loadAsg(best.asg,best.choice);const rep=fin.report();
  const mi=P.mi;
  const slots=P.slots.map(o=>({id:o.s.id,name:o.s.name||'(無名)',abbr:o.s.abbr||(o.s.name||'?').slice(0,1),pname:o.p.name||'(無名)',start:o.s.start,end:o.s.end}));
  return{month:S.month,created,ok:rep.hard===0,viol:rep.viol,soft:rep.soft,
    mi:{Y:mi.Y,M:mi.M,s0:mi.s0,nd:mi.nd,hol:mi.hol,wd:mi.wd,md:mi.md,dn:mi.dn,label:mi.label},slots,
    users:P.U.map(E=>({id:E.id,name:E.name})),
    prevInfo:P.prevInfo,
    inst:P.inst.map((x,i)=>({d:x.d,sid:x.slotId,pid:S.patterns[x.pi].id,sname:x.sname,s:x.s,e:x.e,abbr:x.abbr,wk:x.wk,uids:fin.asg[i].slice(0,fin.req[i]).map(u=>u>=0?P.U[u].id:null)})).filter(x=>x.uids.length),
    wish:Object.fromEntries(S.users.map(u=>[u.id,periodWishes(u.id,mi)]))};
}

function condText(u){

  if(isNum(sp.max))t.push(`月${sp.max}回まで`);
  S.patterns.filter(p=>u.pats.includes(p.id)).forEach(p=>p.slots.forEach(sl=>{const v=sp.slotMax[sl.id];if(isNum(v))t.push(v===0?`「${sl.name}」なし`:`「${sl.name}」${v}回まで`)}));

  return t.join('・')||'—';
}

const zen2han=t=>String(t??'').replace(/[０-９Ａ-Ｚａ-ｚ：－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[〜～―‐−]/g,'-').replace(/　/g,' ').trim();
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';const sep=first.includes('\t')&&!first.includes(',')?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
    if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function parseDays(t){ // 戻り値 {days:[7], hol, any}
  t=zen2han(t).replace(/曜日|曜/g,'');const days=allDays(false);let hol=false;
  if(/毎日|全日|すべて|全て/.test(t))return{days:allDays(true),hol:true,any:true};
  if(/平日/.test(t)){[1,2,3,4,5].forEach(i=>days[i]=true);t=t.replace(/平日/g,'')}
  if(/祝/.test(t)){hol=true;t=t.replace(/祝日?/g,'')}

function parseNgEntry(t){ // 例「水 終日」「平日 18:00-08:00」「18時-8時」
  t=zen2han(t);if(!t)return null;
  const soft=/できれば|なるべく/.test(t),afterHol=/祝日?の?翌日?|祝翌/.test(t);
  t=t.replace(/[（(]?(できれば|なるべく)(避ける)?[)）]?/g,'').replace(/祝日?の?翌日?|祝翌/g,'');
  const tm=[...t.matchAll(/(\d{1,2})\s*(?::|時)\s*(\d{2})?/g)];
  let rule={allDay:true,start:'00:00',end:'00:00'};let rest=t;
  if(tm.length>=2){rule={allDay:false,start:pad(+tm[0][1])+':'+(tm[0][2]||'00'),end:pad(+tm[1][1])+':'+(tm[1][2]||'00')};rest=t.replace(/(\d{1,2})\s*(?::|時)\s*(\d{2})?(分)?/g,'').replace(/-/g,'')}
  else if(tm.length===1)return{err:`「${t}」の時間が読めません（例：18:00-08:00）`};
  const d=parseDays(rest);
  return Object.assign(rule,d.any||afterHol?{days:d.days,hol:d.hol}:{days:allDays(true),hol:true},{soft,afterHol});
}
function parseInterval(t){t=zen2han(t);if(!t)return{intD:null,intH:null};
  const d=/(\d+(?:\.\d+)?)\s*日/.exec(t),h=/(\d+(?:\.\d+)?)\s*時間/.exec(t);
  let hours;if(d||h)hours=(d?+d[1]*24:0)+(h?+h[1]:0);else if(/^\d+(\.\d+)?$/.test(t))hours=+t;else return{err:`インターバル「${t}」が読めません（例：12 または 1日12時間）`};
  return{intD:Math.floor(hours/24),intH:Math.round((hours%24)*10)/10};
}
function ngToText(r){

function rosterPreview(text){

  const head=rows[0].map(h=>zen2han(h).replace(/\s/g,''));const col={};
  RCOL.forEach(([key,al])=>{const i=head.findIndex(h=>al.some(a=>h===a.replace(/\s/g,'')));if(i>=0)col[key]=i});
  if(col['名前']==null)return{err:'1行目（見出し）に「名前」の列が見つかりません。見本のCSVを参考にしてください。'};
  const unknownHead=rows[0].filter((h,i)=>String(h).trim()&&!Object.values(col).includes(i));
  const pmap={};S.patterns.forEach(p=>pmap[zen2han(p.name).replace(/\s/g,'')]=p.id);
  const seen={},out=[];
  rows.slice(1).forEach((r,ri)=>{
    const g=k=>col[k]==null?undefined:zen2han(r[col[k]]);
    const name=String(r[col['名前']]??'').trim();if(!name)return;
    const it={line:ri+2,name,set:{},warn:[]};
    if(seen[name])it.warn.push(`${seen[name]}行目と同じ名前です（後の行で上書きします）`);seen[name]=ri+2;
    const ex=S.users.find(u=>u.name.trim()===name);it.status=ex?'更新':'新規';
    if(g('シフトパターン')!==undefined){const names=g('シフトパターン').split(/[\/／、,，;；\n]/).map(x=>x.replace(/\s/g,'')).filter(Boolean);
      it.set.pats=[];names.forEach(n=>{if(pmap[n])it.set.pats.push(pmap[n]);else it.warn.push(`パターン「${n}」が見つかりません（先に① シフトパターンで登録してください）`)})}
    const numCol=(k,f)=>{const v=g(k);if(v===undefined)return;if(v===''){it.set[f]=null;return}
      const n=Number(v.replace(/[回日]/g,''));if(isFinite(n)&&n>=0)it.set[f]=Math.floor(n);else it.warn.push(`${k}「${v}」が数字ではありません`)};
    numCol('月の上限','max');numCol('勤務希望の上限','maxW');numCol('休み希望の上限','maxO');
    if(g('インターバル')!==undefined){const iv=parseInterval(g('インターバル'));if(iv.err)it.warn.push(iv.err);else{it.set.intD=iv.intD;it.set.intH=iv.intH}}

      (g('勤務できない時間')||'').split(/[;；\n]/).forEach(e=>{if(!e.trim())return;const r2=parseNgEntry(e);if(!r2)return;if(r2.err)it.warn.push(r2.err);else ng.push(r2)});
      it.set.ng=ng}
    if(g('休み希望の前日の夜勤')!==undefined){const v=g('休み希望の前日の夜勤');
      if(v==='')it.set.offPrev=null;else if(/入れない|不可|×|いいえ/.test(v))it.set.offPrev=true;else if(/入れてよい|可|○|はい/.test(v))it.set.offPrev=false;else it.warn.push(`休み希望の前日の夜勤「${v}」は「入れない」か「入れてよい」で書いてください`)}
    if(g('連勤の上限')!==undefined)numCol('連勤の上限','consecMax');
    if(g('週の回数')!==undefined){const v=g('週の回数').replace(/回/g,'');let m;

      else if(m=/^(\d+)\s*(以下|まで)$/.exec(v)){it.set.wkMin=null;it.set.wkMax=+m[1]}

    if(g('パターンの割合')!==undefined){const o={};let bad=false;
      splitList(g('パターンの割合')).forEach(e=>{const m=/^(.*?)[\s:：=]*(\d+)\s*%?$/.exec(e);const p=m&&S.patterns.find(p=>nz(p.name)===nz(m[1]));
        if(p)o[p.id]=+m[2];else{bad=true;it.warn.push(`パターンの割合「${e}」が読めません（例：A（外来） 60%）`)}});

}
function applyRoster(pv){

    if(!u){u={id:'u_'+uid(),name:it.name,pats:[],sp:blankSp()};S.users.push(u)}

    ['max','maxW','maxO','intD','intH','offPrev','consecMax','wkMin','wkMax','patShare','prefDays','prefShare','slotMax'].forEach(k=>{if(k in z)u.sp[k]=z[k]});

}

    pv('勤務希望の扱い','hardW');pv('休み希望の扱い','hardO');pv('時間帯を満遍なく','spread');pv('回数をそろえる','fair');

  });

}
function applyPatterns(pv){

    let p=G.ex;
    if(!p){p={id:'p_'+uid(),name:G.label,slots:[],intD:0,intH:0,maxM:null,maxW:null,maxO:null,hardW:false,hardO:true,mode:'fixed',combos:[],fair:true,spread:false};S.patterns.push(p)}
    p.slots=G.slots.map(x=>{const ex=G.ex&&G.ex.slots.find(s=>nz(s.name)===nz(x.name));
      const sl=ex?Object.assign({},ex,{days:ex.days.slice()}):{id:uid(),name:x.name,abbr:x.name.slice(0,2),start:'08:30',end:'17:15',need:1,days:[false,true,true,true,true,true,false],hol:'exclude'};
      sl.name=x.name;Object.assign(sl,x.set);return sl});
    const z=G.z;
    ['intD','intH','maxM','maxW','maxO','hardW','hardO','spread','fair','mode'].forEach(k=>{if(k in z)p[k]=z[k]});
    if(z.combos)p.combos=z.combos.map(c=>{const counts={};Object.entries(c).forEach(([n,v])=>{const sl=p.slots.find(s=>nz(s.name)===nz(n));if(sl)counts[sl.id]=v});return{id:uid(),counts}});
    else if(p.mode==='combo'){const ids=new Set(p.slots.map(s=>s.id));p.combos.forEach(c=>Object.keys(c.counts).forEach(id=>{if(!ids.has(id))delete c.counts[id]}))}
  });
  if(pv.del){const keep=new Set(pv.groups.map(g=>g.name));const gone=new Set(S.patterns.filter(p=>!keep.has(nz(p.name))).map(p=>p.id));
    S.patterns=S.patterns.filter(p=>!gone.has(p.id));S.users.forEach(u=>u.pats=u.pats.filter(id=>!gone.has(id)))}
}

/* =========== Googleフォーム連携 ===========
   A. かんたん連携：Google Apps Script（管理者のGoogleアカウントで動く小さなプログラム）を1回置くと、
      アプリのボタンでフォームを作り、回答を取り込める（通信するのはこの時だけ）

const GAS_CODE=[

"// 合言葉（勤務表メーカーが自動で作ったもの。変えないでください）",
"const KEY = '__KEY__';",
"",

"",

function gasKey(){const g=S.settings.gas;if(!g.key){g.key=uid()+uid();save()}return g.key}
function gasCode(){return GAS_CODE.replace('__KEY__',gasKey())}
async function gasCall(params){
  const g=S.settings.gas;if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(g.url||''))throw new Error('ウェブアプリのURLが正しくありません（https://script.google.com/macros/s/…/exec の形）');
  const u=new URL(g.url);u.searchParams.set('key',gasKey());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  let r;try{r=await fetch(u.toString())}catch(e){throw new Error('Googleに接続できませんでした（インターネット接続、またはスクリプトの「アクセスできるユーザー：全員」を確認してください）')}

/* 回答の行 {name, work, off, note}（work/off は配列か文字列）から、取り込み内容を作る */
function gformPreview(rows,source){
  const mi=monthInfo(),P=buildProblem(),md2d={};for(let d=1;d<=mi.nd;d++)md2d[mi.md[d]]=d;
  const parseDates=v=>{const ds=[],bad=[];(Array.isArray(v)?v:[v]).forEach(t=>{const s2=zen2han(t||'');if(!s2.trim())return;const re=/(\d{1,2})\s*[\/月]\s*(\d{1,2})/g;let m,found=false;
    while(m=re.exec(s2)){found=true;const d=md2d[`${+m[1]}/${+m[2]}`];if(d)ds.push(d);else bad.push(`${+m[1]}/${+m[2]}`)}if(!found)bad.push(s2.trim())});
    return{ds:[...new Set(ds)].sort((a,b)=>a-b),bad}};
  const last={};rows.forEach(r=>{const n=String(r.name||'').trim();if(n)last[nz(n)]=Object.assign({},r,{name:n})});
  const out=Object.values(last).map(r=>{
    const u=S.users.find(x=>nz(x.name)===nz(r.name)),warn=[];
    let W=parseDates(r.work),O=parseDates(r.off);
    if(W.bad.length)warn.push(`期間外か読めない勤務希望：${W.bad.join('、')}`);
    if(O.bad.length)warn.push(`期間外か読めない休み希望：${O.bad.join('、')}`);
    let work=W.ds,off=O.ds;
    const both=work.filter(d=>off.includes(d));if(both.length){work=work.filter(d=>!both.includes(d));warn.push(`同じ日に勤務希望と休み希望：${both.map(d=>lab(mi,d)).join('、')}（休み希望として取り込みます）`)}
    if(u){const k=P.U.findIndex(e=>e.id===u.id),av=new Set(P.inst.filter((x,i)=>k>=0&&P.base[i][k]).map(x=>x.d));
      const na=work.filter(d=>!av.has(d));if(na.length){work=work.filter(d=>av.has(d));warn.push(`入れる勤務がない日の勤務希望：${na.map(d=>lab(mi,d)).join('、')}（取り込みません）`)}
      const E=eff(u);if(E.maxW!=null&&work.length>E.maxW)warn.push(`勤務希望が上限（${E.maxW}日）を超えています`);if(E.maxO!=null&&off.length>E.maxO)warn.push(`休み希望が上限（${E.maxO}日）を超えています`)}
    else warn.push('名簿にいない名前です（取り込みません）');
    return{name:r.name,uid:u?u.id:null,work,off,note:String(r.note||''),warn};
  });
  return{rows:out,source,replace:true,label:mi.label,month:S.month};
}
function gformFromTable(text){
  const rows=parseCSV(text);if(rows.length<2)return{err:'見出しの行と、1行以上の回答が必要です。'};

  const cN=find(/名前|氏名/),cW=find(/勤務希望/),cO=find(/休み希望|休暇希望|休希望/),cR=find(/備考/);
  if(cN<0||(cW<0&&cO<0))return{err:'見出しに「お名前」と「勤務希望日」または「休み希望日」の列が必要です（フォームの回答のスプレッドシートを、見出しの行も含めてコピーしてください）。'};

}

function csvOut(month){

  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const bySlot={};r.inst.forEach(x=>{(bySlot[x.sid]=bySlot[x.sid]||{})[x.d]=x});const used=r.slots.filter(s=>bySlot[s.id]);
  const L=[];L.push([`${resLabel(r)} 勤務表（日別）`].map(q).join(','));
  L.push(['日付','曜日','休日',...used.map(s=>s.name)].map(q).join(','));
  for(let d=1;d<=mi.nd;d++)L.push([lab(mi,d),WD[mi.wd[d]],mi.hol[d]||'',...used.map(s=>{const x=bySlot[s.id][d];return x?x.uids.map(v=>v?name[v]:'不足').join('・'):''})].map(q).join(','));
  L.push('');L.push([`個人別`].map(q).join(','));
  L.push(['名前',...Array.from({length:mi.nd},(_,j)=>`${lab(mi,j+1)}(${WD[mi.wd[j+1]]})`),'合計'].map(q).join(','));
  r.users.forEach(u=>{let t=0;const row=[u.name];for(let d=1;d<=mi.nd;d++){const a=r.inst.filter(x=>x.d===d&&x.uids.includes(u.id)).map(x=>x.abbr);t+=a.length;row.push(a.join(''))}row.push(t);L.push(row.map(q).join(','))});

}

    gCsv(){$('#gcsvIn').click();return false},
    gCancel(){UI.gimp=null},
    gApply(){const pv=UI.gimp;if(!pv)return false;if(pv.month!==S.month){toast('期間が変わっています。もう一度読み込んでください');UI.gimp=null;return}
      const n=applyGform(pv);UI.gimp=null;UI.gmsg={t:`${n}人分の希望を取り込みました。`}},
    pickPV(){UI.pv=D.id},
    pm(){S.month=addMonth(S.month,+D.k)},
    openU(){UI.openU.add(D.id);setTimeout(()=>{const el=document.querySelector(`details.ucard[data-uid="${D.id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},30)},
    solveGo(){UI.tab='gen';save();render();setTimeout(()=>{const b=document.querySelector('[data-act=solve]');if(b)b.click()},30);return false},
    wish(){
      const u=S.users.find(x=>x.id===UI.wu);if(!u)return false;const w=periodWishes(u.id),d=+D.d,E=eff(u),cur=w[d];
      if(UI.mode==='X'||cur===UI.mode){setWish(u.id,d,null);return}
      const cnt=Object.values(w).filter(v=>v===UI.mode).length;
      const lim=UI.mode==='W'?E.maxW:E.maxO;
      if(lim!=null&&cnt>=lim){toast(`${UI.mode==='W'?'勤務希望':'休み希望'}は${lim}日までです`);return false}
      if(UI.mode==='W'){const P=buildProblem(),k=P.U.findIndex(x=>x.id===u.id);if(!P.inst.some((x,i)=>x.d===+d&&k>=0&&P.base[i][k])){toast('この日はこの人が入れる勤務がありません');return false}}
      setWish(u.id,d,UI.mode)},
    solve(){UI.busy=true;render();setTimeout(()=>{let res;try{res=solveAll(UI.budget)}catch(x){console.error(x);res={month:S.month,created:new Date().toLocaleString('ja-JP'),pre:true,ok:false,errors:['計算中にエラーが起きました：'+x.message]}}
      S.results[S.month]=res;save();UI.busy=false;if(!res.pre)UI.tab='chk';render();window.scrollTo(0,0)},60);return false},
    csv(){csvOut(D.m);return false},
    histPick(){UI.hist=D.m},
    pcsvTpl(){download('シフトパターンの見本.csv',csvText(patternTemplate()),'text/csv');return false},
    pcsvOut(){download('シフトパターン.csv',csvText([PCOL.map(c=>c[0]),...patternRows()]),'text/csv');return false},
    pcsvPick(){$('#pcsvIn').click();return false},
    pcsvCancel(){UI.pcsv=null},
    pcsvApply(){const pv=UI.pcsv;if(!pv||!pv.groups)return false;
      if(pv.del){const keep=new Set(pv.groups.map(g=>g.name));const gone=S.patterns.filter(p=>!keep.has(nz(p.name))).map(p=>p.name);
        if(gone.length&&!confirm(`次のシフトパターンを削除します。メンバーの登録からも外れます。よろしいですか？\n${gone.join('、')}`))return false}
      applyPatterns(pv);UI.pcsv=null;toast(`${pv.groups.length}パターンを取り込みました`)},
    csvTpl(){download('名簿の見本.csv',csvText(rosterTemplate()),'text/csv');return false},
    csvRoster(){download('名簿.csv',csvText([RCOL.map(c=>c[0]),...rosterRows()]),'text/csv');return false},
    csvPick(){$('#csvIn').click();return false},
    csvCancel(){UI.csv=null},
    csvApply(){const pv=UI.csv;if(!pv||!pv.rows)return false;
      if(pv.del){const keep=new Set(pv.rows.map(r=>r.name));const gone=S.users.filter(u=>!keep.has(u.name.trim())).map(u=>u.name);
        if(gone.length&&!confirm(`次のメンバーを削除します。よろしいですか？\n${gone.join('、')}`))return false}
      applyRoster(pv);UI.csv=null;toast(`${pv.rows.length}人分を取り込みました`)},
    histDel(){if(!confirm(`${resLabel(S.results[D.m])}の勤務表を削除しますか？`))return false;delete S.results[D.m];if(UI.hist===D.m)UI.hist=null},
    print(){window.print();return false},
    export(){const d=new Date();download(`勤務表メーカー_バックアップ_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,JSON.stringify(S,null,1),'application/json');return false},
    import(){$('#fileIn').click();return false},
    sample(){if(!confirm('今の内容を消して、見本データにしますか？'))return false;S=sampleState()},
    reset(){if(!confirm('すべてのデータを消します。よろしいですか？（先にバックアップをおすすめします）'))return false;S=migrate({v:1,month:nextMonth(),settings:defSettings(),patterns:[],users:[],wishD:{},extraHol:[],results:{},balance:[]})}
  };
  if(!A[a])return;
  if(A[a]()===false)return;
  save();render();
});
render();
</script>
</body>
</html>
